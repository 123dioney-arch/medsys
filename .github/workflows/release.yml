name: Release MedBC Pro
on:
  push:
    branches:
      - main
jobs:
  release:
    permissions:
      contents: write
      id-token: write
      packages: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            bundle: msi
          - os: macos-latest
            platform: darwin-x86_64
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Verificar clave
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Clave encontrada, longitud: ${#TAURI_SIGNING_PRIVATE_KEY}"
          else
            echo "ERROR: Clave no encontrada"
            exit 1
          fi
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: MedBC Pro v__VERSION__
          releaseBody: "Nueva versión de MedBC Pro"
          releaseDraft: false
          prerelease: false

  update-latest-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          # Esperar a que los assets estén disponibles
          sleep 30

          # Descargar firmas
          WIN_SIG=$(gh release download "v$VERSION" --pattern "*.msi.sig" --output - 2>/dev/null || echo "")
          MAC_SIG=$(gh release download "v$VERSION" --pattern "*.dmg.sig" --output - 2>/dev/null || echo "")

          WIN_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/bc-app_${VERSION}_x64_en-US.msi"
          MAC_URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/bc-app_${VERSION}_x64.dmg"

          cat > latest.json << EOF
          {
            "version": "v$VERSION",
            "notes": "Nueva version de MedBC Pro",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "$WIN_URL",
                "signature": "$WIN_SIG"
              },
              "darwin-x86_64": {
                "url": "$MAC_URL",
                "signature": "$MAC_SIG"
              }
            }
          }
          EOF

          gh release upload "v$VERSION" latest.json --clobber
