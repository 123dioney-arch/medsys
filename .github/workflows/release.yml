name: Release MedBC Pro
on:
  push:
    branches:
      - main
jobs:
  release:
    permissions:
      contents: write
      id-token: write
      packages: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Verificar clave
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "Clave encontrada, longitud: $($env:TAURI_SIGNING_PRIVATE_KEY.Length)"
          } else {
            Write-Host "ERROR: Clave no encontrada"
            exit 1
          }
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: MedBC Pro v__VERSION__
          releaseBody: "Nueva versión de MedBC Pro"
          releaseDraft: false
          prerelease: false
      - name: Find and upload latest.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          $signature = ""
          if ($sigFile) {
            $signature = Get-Content $sigFile.FullName -Raw
            Write-Host "Firma encontrada: $($sigFile.FullName)"
          } else {
            Write-Host "ERROR: No se encontro archivo .sig"
            exit 1
          }
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/bc-app_${version}_x64_en-US.msi"
          $json = @{
            version = "v$version"
            notes = "Nueva version de MedBC Pro"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                url = $url
                signature = $signature.Trim()
              }
            }
          } | ConvertTo-Json -Depth 5
          $json | Out-File -FilePath latest.json -Encoding utf8
          gh release upload "v$version" latest.json --clobber
